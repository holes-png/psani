<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klávesnicový Mistr ⌨️</title>
  <!-- Načtení Tailwind CSS pro moderní vzhled -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Načtení Google Fonts pro stylové písmo -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; }
    @keyframes shakeHero {
      0%, 100% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-10px) rotate(-8deg) scale(0.95); }
      75% { transform: translateX(10px) rotate(8deg) scale(0.95); }
    }
    @keyframes breatheHero {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-5px) scaleY(1.03); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes wind {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(20deg); }
    }
    @keyframes spin-slow {
      100% { transform: rotate(360deg); }
    }
    .animate-shake { animation: shakeHero 0.3s ease-in-out; }
    .animate-breathe { animation: breatheHero 3s ease-in-out infinite; transform-origin: 100px 150px; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-wind { animation: wind 2s ease-in-out infinite; }
    .animate-spin-slow { animation: spin-slow 15s linear infinite; }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col justify-between">

  <!-- HLAVNÍ KONTEJNER -->
  <div id="app" class="w-full max-w-6xl mx-auto p-2 sm:p-4 my-auto">
    <!-- Dynamicky se měnící obsah přes JavaScript -->
  </div>

  <script>
    // --- DATABÁZE ÚROVNÍ TEXTU ---
    const LEVELS = {
      1: {

      },
      5: {

        description: 'Skupiny 4 znaků (písmena a jednoduché znaky).',
        words: ['a+B-', 'x?Z!', '1@9&', '+A-b', '=1?2', '!.@,', '&*()', 'A@b*', 'X+y-', '1*2(', 'c&D*', 'E!f?', 'g@H+', '3-4=', 'i,J.', 'k?L!', 'm+N-', '5&6*', 'o(P)', 'q=R+', 's?T!', 'u@V&', 'w+X-', 'y*Z(', '7@8&', '9-0=', 'a.B,', 'c!D?', 'e(F)', 'g*H&']
      },
      6: {

        description: 'Skupiny 6 složitých znaků (často s AltGr).',
        words: ['#a${}b', '[c]d<e', '>f~g\\', '|h^i€', '§j°k#', '$l{m}', '[n<o>', '~p\\q|', '^r€s§', '°t#u$', '{v}w[', ']x<y>', '~z\\A|', '^B€C§', '°D#E$', '{F}G[', ']H<I>', '~J\\K|', '^L€M§', '°N#O$', '#1$2{3', '}4[5]', '<6>7~8', '\\9|0^', '€a§b°', '#X$Y{Z', '}A[B]', '<C>D~E', '\\F|G^', '§1°2#']
      }
    };

    const BOSS_TEXTS = [
      "Rychle napiš tohle slovo, než boss zaútočí!",
      "Temný drak chrlí oheň, braň se rychle!",
      "Kouzelník sesílá blesk, odraz ho klávesnicí!",
      "Pozor na padající meteorit, uhni!",
      "Tohle je ultimátní zkouška tvé rychlosti."
    ];

    // --- GLOBÁLNÍ FUNKCE ---
    function getExpNeeded(level) {
      const req = { 1: 10, 2: 15, 3: 20, 4: 25, 5: 40, 6: 60, 7: 90, 8: 140, 9: 200 };
      return req[level] || 9999;
    }

    function getCumulativeExp(targetLevel) {
      if (targetLevel === 1) return 0;
      let total = 0;
      for (let i = 1; i < targetLevel; i++) {
        total += getExpNeeded(i);
      }
      return total;
    }

    function getHintForChar(char) {
      if (!char) return null;
      const charMap = {
        'ť': [['Shift', 'ˇ (vedle Backspace)', 'poté', 't']], 'ď': [['Shift', 'ˇ (vedle Backspace)', 'poté', 'd']], 'ň': [['Shift', 'ˇ (vedle Backspace)', 'poté', 'n']],
        'Ť': [['Shift', 'ˇ', 'poté', 'Shift', 'T']], 'Ď': [['Shift', 'ˇ', 'poté', 'Shift', 'D']], 'Ň': [['Shift', 'ˇ', 'poté', 'Shift', 'N']],
        '@': [['Pravý Alt (AltGr)', 'V']], '#': [['Pravý Alt (AltGr)', 'X']], '&': [['Pravý Alt (AltGr)', 'C']],
        '{': [['Pravý Alt (AltGr)', 'B']], '}': [['Pravý Alt (AltGr)', 'N']], '[': [['Pravý Alt (AltGr)', 'F']],
        ']': [['Pravý Alt (AltGr)', 'G']], '<': [['Pravý Alt (AltGr)', ',']], '>': [['Pravý Alt (AltGr)', '.']],
        '~': [['Pravý Alt (AltGr)', '1']], '\\': [['Pravý Alt (AltGr)', 'Q']], '|': [['Pravý Alt (AltGr)', 'W']],
        '^': [['Pravý Alt (AltGr)', '3']], '€': [['Pravý Alt (AltGr)', 'E']], '§': [['Klávesa pod Esc']],
        '°': [['Pravý Alt (AltGr)', '5']], '$': [['Pravý Alt (AltGr)', 'Ů']], '?': [['Shift', ', (čárka)']],
        '!': [['Shift', '§ (pod Esc)']], '+': [['Numerická +'], ['1 (vlevo nahoře)']], '-': [['Numerická -'], ['- (vedle pravého Shiftu)']],
        '=': [['Shift', '- (vedle pravého Shiftu)']], '*': [['Numerická *'], ['Pravý Alt (AltGr)', '-']], '/': [['Numerická /'], ['Shift', 'ú']],
        '.': [['Numerická .'], ['Klávesa . (vedle čárky)']], ',': [['Klávesa , (vedle M)']], ' ': [['Mezerník (nejdelší klávesa dole)']],
        'á': [['Číslo 8 (v horní řadě)']], 'é': [['Číslo 0 (v horní řadě)']], 'í': [['Číslo 9 (v horní řadě)']],
        'ý': [['Číslo 7 (v horní řadě)']], 'ú': [['Klávesa vedle P']], 'ů': [['Klávesa vedle L']],
        'š': [['Číslo 3 (v horní řadě)']], 'č': [['Číslo 4 (v horní řadě)']], 'ř': [['Číslo 5 (v horní řadě)']],
        'ž': [['Číslo 6 (v horní řadě)']], 'ě': [['Číslo 2 (v horní řadě)']], '(': [['Shift', '8 (v horní řadě)']], ')': [['Shift', '9 (v horní řadě)']],
      };
      if (charMap[char]) return charMap[char];
      if (/[0-9]/.test(char)) return [[`Numerická ${char}`], ['Shift', `${char} (v horní řadě)`]];
      if (/[A-Z]/.test(char)) return [['Shift', char.toUpperCase()]];
      if (/[ÁÉÍÓÚŮÝŠČŘŽ]/.test(char)) {
        const lower = char.toLowerCase();
        if (charMap[lower]) return [['Shift', charMap[lower][0][0]]];
      }
      return [[`Klávesa ${char.toUpperCase()}`]];
    }

    // --- STATE MANAGEMENT ---
    let state = {
      appMode: null, 
      gameState: 'mode_select', 
      currentLevel: null,
      currentWord: '',
      typedText: '',
      score: 0,
      skips: 0,
      correctStrokes: 0,
      wrongStrokes: 0,
      startTime: null,
      elapsedSeconds: 0,
      canSkip: true,
      showHint: false,
      hp: 100,
      charLevel: 1,
      exp: 0,
      gold: 0,
      potions: 0,
      ownedPets: [],
      activePet: null,
      wordsTypedCounter: 0,
      isBossFight: false,
      bossTimeLeft: 0,
      hitAnim: false,
      healAnim: false,
      levelUpAnim: false,
      soundEnabled: false,
      recentHistory: []
    };

    let audioCtx = null;

    function loadSave() {
      try {
        const saved = localStorage.getItem('klavesnicovy_mistr_save_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.charLevel = parsed.charLevel || 1;
          state.exp = parsed.exp || 0;
          state.gold = parsed.gold || 0;
          state.potions = parsed.potions || 0;
          state.ownedPets = parsed.ownedPets || [];
          state.activePet = parsed.activePet || null;
        }
      } catch (e) { console.error("Nelze nacist ukladani:", e); }
    }

    function saveGame() {
      try {
        const data = {
          charLevel: state.charLevel, exp: state.exp, gold: state.gold,
          potions: state.potions, ownedPets: state.ownedPets, activePet: state.activePet
        };
        localStorage.setItem('klavesnicovy_mistr_save_v1', JSON.stringify(data));
      } catch (e) { console.error("Nelze ulozit:", e); }
    }

    function playTone(type) {
      if (!state.soundEnabled) return;
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'heal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(550, now); osc.frequency.exponentialRampToValueAtTime(1100, now + 0.3);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'levelup') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.15);
        osc.frequency.setValueAtTime(660, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'boss_warn') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'buy') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1400, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    function pickWord(levelId) {
      const words = LEVELS[levelId].words;
      let avail = words.filter(w => !state.recentHistory.includes(w));
      if (avail.length === 0) avail = words;
      return avail[Math.floor(Math.random() * avail.length)];
    }

    function checkLevelUp() {
      const needed = getExpNeeded(state.charLevel);
      if (state.exp >= needed && state.charLevel < 10) {
        state.charLevel++;
        state.exp -= needed;
        state.levelUpAnim = true;
        playTone('levelup');
        setTimeout(() => { state.levelUpAnim = false; render(); }, 3000);
      }
    }

    // --- BUTTON A EVENT FUNKCE ---
    function toggleSoundBtn() { 
      state.soundEnabled = !state.soundEnabled; 
      if (state.soundEnabled && !audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      render(); 
    }

    function setMode(mode) {
      state.appMode = mode;
      state.gameState = 'level_select';
      render();
    }

    function goState(target) {
      state.gameState = target;
      if (target === 'level_select') state.startTime = null;
      render();
    }

    function startLevel(levelId) { 
      state.currentLevel = levelId;
      state.score = 0; state.skips = 0; state.correctStrokes = 0; state.wrongStrokes = 0;
      state.startTime = null; state.elapsedSeconds = 0; state.canSkip = true; state.typedText = '';
      state.showHint = false; state.isBossFight = false; state.wordsTypedCounter = 0;
      if (state.appMode === 'game') state.hp = 100;
      state.recentHistory = [];
      const firstWord = pickWord(levelId);
      state.currentWord = firstWord;
      state.recentHistory.push(firstWord);
      state.gameState = 'playing';
      render();
    }

    function handleStroke(e) {
      if (state.gameState !== 'playing') return;
      const inputVal = e.target.value;

      if (!state.startTime) state.startTime = Date.now();

      if (inputVal.length > state.typedText.length) {
        const expectedPrefix = state.currentWord.substring(0, inputVal.length);
        if (inputVal === expectedPrefix) {
          state.correctStrokes++;
          playTone('hit');
        } else {
          state.wrongStrokes++;
          playTone('error');
          if (state.appMode === 'game') {
            state.hp -= 5;
            state.hitAnim = true;
            setTimeout(() => { state.hitAnim = false; render(); }, 300);
            if (state.hp <= 0) {
              state.gameState = 'game_over';
              saveGame();
              render();
              return;
            }
          }
        }
      }

      state.typedText = inputVal;

      if (inputVal === state.currentWord) {
        setTimeout(() => {
          state.score++;
          state.canSkip = true;

          if (state.appMode === 'game') {
            if (state.isBossFight) {
              state.isBossFight = false;
              state.hp = Math.min(100, state.hp + 20);
              state.exp += 20;
              state.gold += 50;
              playTone('levelup');
            } else {
              let bGold = state.activePet === 'dog' ? 2 : 0;
              let bExp = state.activePet === 'dragon' ? 1 : 0;
              let bHeal = state.activePet === 'cat' ? 3 : 1;

              state.hp = Math.min(100, state.hp + bHeal);
              state.exp += LEVELS[state.currentLevel].id + bExp;
              state.gold += state.currentWord.length + bGold;
              state.healAnim = true;
              playTone('heal');
              setTimeout(() => { state.healAnim = false; render(); }, 400);
            }

            checkLevelUp();
            state.wordsTypedCounter++;
            if (state.wordsTypedCounter % 15 === 0 && !state.isBossFight) {
              state.isBossFight = true;
              playTone('boss_warn');
              state.bossTimeLeft = 15;
              state.typedText = '';
              state.currentWord = BOSS_TEXTS[Math.floor(Math.random() * BOSS_TEXTS.length)];
              saveGame();
              render();
              return;
            }
          }

          state.typedText = '';
          const nextW = pickWord(state.currentLevel);
          state.currentWord = nextW;
          state.recentHistory.push(nextW);
          if (state.recentHistory.length > 10) state.recentHistory.shift();
          saveGame();
          render();
        }, 200);
      }
      render();
    }

    function drinkPotion() { 
      if (state.potions > 0 && state.hp < 100) {
        state.potions--; state.hp = Math.min(100, state.hp + 50);
        playTone('heal'); state.healAnim = true;
        setTimeout(() => { state.healAnim = false; render(); }, 400);
        render();
      }
    }

    function skipWord() { 
      if (!state.canSkip || state.isBossFight) return;
      state.skips++; state.canSkip = false; state.typedText = '';
      const nextW = pickWord(state.currentLevel);
      state.currentWord = nextW;
      state.recentHistory.push(nextW);
      if (state.recentHistory.length > 10) state.recentHistory.shift();
      render();
    }

    function buyShopItem(itemType, price, id) { 
      if (state.gold >= price) {
        state.gold -= price; playTone('buy');
        if (itemType === 'potion') state.potions++;
        else if (itemType === 'pet') { state.ownedPets.push(id); state.activePet = id; }
        saveGame();
      } else playTone('error');
      render();
    }

    function equipPet(id) { 
      state.activePet = id; playTone('buy'); saveGame(); render(); 
    }

    // --- TIMERS ---
    setInterval(() => {
      if (state.gameState === 'playing' && state.startTime && !state.isBossFight) {
        state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
        render();
      }
    }, 1000);

    setInterval(() => {
      if (state.gameState === 'playing' && state.isBossFight && state.bossTimeLeft > 0) {
        state.bossTimeLeft--;
        if (state.bossTimeLeft === 0) {
          playTone('error');
          state.hp -= 30;
          state.hitAnim = true;
          setTimeout(() => { state.hitAnim = false; render(); }, 500);
          state.isBossFight = false;
          state.typedText = '';
          state.currentWord = pickWord(state.currentLevel);
          if (state.hp <= 0) state.gameState = 'game_over';
        }
        render();
      }
    }, 1000);

    // --- Vykreslování Hrdiny (SVG) ---
    function renderAvatar(level, isSmall = false) {
      const hit = state.hitAnim || (state.isBossFight && !isSmall);
      const heal = state.healAnim && !isSmall;
      const lvlUp = state.levelUpAnim && !isSmall;
      
      let filterClass = "";
      if (hit) filterClass = "drop-shadow-[0_0_30px_rgba(239,68,68,1)]";
      else if (heal) filterClass = "drop-shadow-[0_0_30px_rgba(34,197,94,1)]";
      else if (lvlUp) filterClass = "drop-shadow-[0_0_50px_rgba(234,179,8,1)]";

      const szClass = isSmall ? "w-28 h-28 sm:w-36 sm:h-36 border-4" : "w-48 h-48 md:w-64 md:h-64 border-8";
      const svgScale = isSmall ? "scale(0.85) translate(15, 10)" : "scale(1)";

      let weaponSVG = ""; let accessorySVG = "";
      let armorSVG = `
        <path d="M 75 90 L 125 90 L 135 160 Q 100 175 65 160 Z" fill="#b08968" />
        <path d="M 75 90 L 125 90 L 128 110 Q 100 120 72 110 Z" fill="#ddb892" />
        <rect x="80" y="135" width="18" height="18" fill="#7f5539" transform="rotate(-5, 87, 142)" />
        <path d="M 82 135 L 96 152 M 96 135 L 82 152" stroke="#000" stroke-width="1" stroke-opacity="0.6"/>
        <path d="M 70 125 Q 100 135 130 125 L 132 135 Q 100 145 68 135 Z" fill="#7f4f24" />
        <rect x="85" y="160" width="12" height="25" fill="#7f5539" />
        <rect x="103" y="160" width="12" height="25" fill="#7f5539" />
        <path d="M 78 185 L 97 185 Q 97 175 87 175 Z" fill="#432818" />

                <h2 class="text-2xl font-bold text-green-800 mb-4">Magická Zvířátka</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                  <div class="bg-white p-4 rounded-xl border-2 border-green-300 flex flex-col items-center"><span class="text-4xl">🐕</span><span class="font-bold">Pes</span><span class="text-xs text-green-700 text-center mb-3">+2 zlaťáky</span>${dogBought ? `<button onclick="equipPet('dog');" class="px-4 py-2 rounded-lg font-bold text-sm w-full ${state.activePet === 'dog' ? 'bg-green-500 text-white' : 'bg-gray-200'}">${state.activePet === 'dog' ? 'Aktivní' : 'Vybavit'}</button>` : `<button onclick="buyShopItem('pet', 200, 'dog');" class="px-4 py-2 rounded-lg font-bold text-sm w-full bg-amber-400 text-white">200 🪙</button>`}</div>
                  <div class="bg-white p-4 rounded-xl border-2 border-green-300 flex flex-col items-center"><span class="text-4xl">🐈</span><span class="font-bold">Kočka</span><span class="text-xs text-green-700 text-center mb-3">+3 heal HP</span>${catBought ? `<button onclick="equipPet('cat');" class="px-4 py-2 rounded-lg font-bold text-sm w-full ${state.activePet === 'cat' ? 'bg-green-500 text-white' : 'bg-gray-200'}">${state.activePet === 'cat' ? 'Aktivní' : 'Vybavit'}</button>` : `<button onclick="buyShopItem('pet', 300, 'cat');" class="px-4 py-2 rounded-lg font-bold text-sm w-full bg-amber-400 text-white">300 🪙</button>`}</div>
                  <div class="bg-white p-4 rounded-xl border-2 border-green-300 flex flex-col items-center"><span class="text-4xl">🦉</span><span class="font-bold">Sova</span><span class="text-xs text-green-700 text-center mb-3">Chytrý pohled</span>${owlBought ? `<button onclick="equipPet('owl');" class="px-4 py-2 rounded-lg font-bold text-sm w-full ${state.activePet === 'owl' ? 'bg-green-500 text-white' : 'bg-gray-200'}">${state.activePet === 'owl' ? 'Aktivní' : 'Vybavit'}</button>` : `<button onclick="buyShopItem('pet', 400, 'owl');" class="px-4 py-2 rounded-lg font-bold text-sm w-full bg-amber-400 text-white">400 🪙</button>`}</div>
                  <div class="bg-white p-4 rounded-xl border-2 border-green-300 flex flex-col items-center"><span class="text-4xl">🐉</span><span class="font-bold">Dráček</span><span class="text-xs text-green-700 text-center mb-3">+1 EXP</span>${dragonBought ? `<button onclick="equipPet('dragon');" class="px-4 py-2 rounded-lg font-bold text-sm w-full ${state.activePet === 'dragon' ? 'bg-green-500 text-white' : 'bg-gray-200'}">${state.activePet === 'dragon' ? 'Aktivní' : 'Vybavit'}</button>` : `<button onclick="buyShopItem('pet', 1000, 'dragon');" class="px-4 py-2 rounded-lg font-bold text-sm w-full bg-amber-400 text-white">1000 🪙</button>`}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      else if (state.gameState === 'playing') {
        const expectedPrefix = state.currentWord.substring(0, state.typedText.length);
        const wrongText = state.typedText !== expectedPrefix;
        const currentCpm = state.elapsedSeconds > 0 ? Math.round((state.correctStrokes / state.elapsedSeconds) * 60) : 0;
        const totalStrokes = state.correctStrokes + state.wrongStrokes;
        const accuracy = totalStrokes > 0 ? Math.round((state.correctStrokes / totalStrokes) * 100) : 100;

        let lettersHtml = "";
        state.currentWord.split('').forEach((char, index) => {
          let col = "text-gray-700"; let bg = "";
          if (index < state.typedText.length) {
            if (state.typedText[index] === char) col = "text-green-500 font-bold";
            else { col = "text-red-500 font-bold"; bg = "bg-red-100 rounded-sm"; }
          }
          if (char === ' ') lettersHtml += `<span class="inline-block w-4 mx-1 ${bg}">&nbsp;</span>`;
          else lettersHtml += `<span class="inline-block ${col} ${bg}">${char}</span>`;
        });

        const expectedChar = state.currentWord[state.typedText.length];
        const hintData = expectedChar ? getHintForChar(expectedChar) : null;
        let hintHtml = "";
        if (state.showHint && hintData) {
          let keysMarkup = "";
          hintData.forEach((combo, comboIdx) => {
            if (comboIdx > 0) keysMarkup += `<span class="text-gray-400 font-black mx-4 text-xl">NEBO</span>`;
            combo.forEach((key, keyIdx) => {
              if (keyIdx > 0 && key !== 'poté') keysMarkup += `<span class="text-blue-400 font-black text-3xl">+</span>`;
              if (key === 'poté') keysMarkup += `<span class="text-gray-500 font-black mx-3 uppercase tracking-widest text-lg">potom</span>`;
              else keysMarkup += `<kbd class="px-5 py-3 bg-white border-2 border-b-8 border-gray-300 rounded-2xl font-black text-gray-800 text-2xl shadow-sm">${key}</kbd>`;
            });
          });
          hintHtml = `
            <div class="mt-10 max-w-3xl mx-auto border-4 rounded-3xl p-8 text-left shadow-inner ${state.isBossFight ? 'bg-red-50 border-red-300' : 'bg-blue-50 border-blue-200'}">
              <div class="text-2xl text-gray-700 text-center mb-6">Pro napsání znaku <strong class="text-4xl bg-white px-4 py-2 rounded-xl border-4 mx-3 shadow-sm ${state.isBossFight ? 'text-red-600 border-red-300' : 'text-blue-600 border-blue-300'}">${expectedChar === ' ' ? 'MEZERA' : expectedChar}</strong> zmáčkni:</div>
              <div class="flex flex-col gap-6 items-center justify-center">${keysMarkup}</div>
            </div>
          `;
        }

        root.innerHTML = `
          <div class="w-full">
            ${state.appMode === 'game' ? `
              <div class="${state.isBossFight ? 'bg-red-900 border-red-500 animate-pulse' : 'bg-white border-indigo-200'} rounded-3xl shadow-xl border-4 mb-6 p-6 flex flex-col md:flex-row items-center justify-around gap-8 transition-colors">
                <div class="relative">
                  ${state.isBossFight ? `<div class="absolute -top-10 text-white font-black text-3xl animate-pulse text-center w-full z-10">BOSS ÚTOČÍ!</div>` : ''}
                  ${renderAvatar(state.charLevel)}
                </div>
                <div class="flex-grow max-w-lg w-full flex flex-col gap-6">
                  <div>
                    <div class="flex justify-between font-black mb-1"><span class="text-red-700">❤️ Životy</span><span class="text-red-600">${state.hp} / 100</span></div>
                    <div class="h-6 bg-red-100 rounded-full border-2 border-red-200 overflow-hidden shadow-inner"><div class="bg-red-500 h-full transition-all" style="width: ${state.hp}%"></div></div>
                  </div>
                  <div class="flex items-center gap-4">
                    <div class="flex-grow">
                      <div class="flex justify-between font-black mb-1"><span class="text-blue-700">⭐ Zkušenosti</span><span>${state.charLevel >= 10 ? 'MAX LEVEL' : `${state.exp} / ${expNeededForNextLevel}`}</span></div>
                      <div class="h-6 bg-blue-100 rounded-full border-2 border-blue-200 overflow-hidden shadow-inner"><div class="bg-blue-500 h-full transition-all" style="width: ${state.charLevel >= 10 ? 100 : (state.exp / expNeededForNextLevel) * 100}%"></div></div>
                    </div>
                    <button onclick="drinkPotion();" ${state.potions <= 0 || state.hp >= 100 ? 'disabled' : ''} class="p-3 bg-red-100 hover:bg-red-200 border-2 border-red-300 rounded-xl transition-all disabled:opacity-40">🧪 <span class="font-bold text-sm">${state.potions}x</span></button>
                  </div>
                </div>
              </div>
            ` : ''}

            <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-3xl border-2 border-indigo-100 gap-4 mb-6">
              <div class="flex gap-4">
                <button onclick="goState('level_select');" class="bg-gray-100 font-bold px-4 py-2 hover:bg-gray-200 rounded-xl">← Odejít</button>
                <button onclick="toggleSoundBtn();" class="bg-gray-100 font-bold px-4 py-2 hover:bg-gray-200 rounded-xl">${state.soundEnabled ? '🔊' : '🔇'}</button>
              </div>
              <div class="flex flex-wrap gap-4 justify-center text-lg font-bold">
                ${state.appMode === 'game' ? `<div class="bg-amber-100 px-4 py-1 rounded-xl">🪙 ${state.gold}</div>` : ''}
                <div class="bg-green-100 px-4 py-1 rounded-xl">✓ ${state.score}</div>
                <div class="bg-red-100 px-4 py-1 rounded-xl">❌ ${state.wrongStrokes}</div>
                <div class="bg-blue-100 px-4 py-1 rounded-xl">🎯 ${accuracy} %</div>
                <div class="bg-indigo-100 px-4 py-1 rounded-xl">⚡ ${currentCpm} CPM</div>
                ${state.isBossFight ? `<div class="bg-white text-red-600 px-4 py-1 rounded-xl border-2 border-red-600 animate-pulse font-black">⏳ ${state.bossTimeLeft}s</div>` : ''}
              </div>
            </div>

            <div class="${state.isBossFight ? 'bg-red-50 border-red-400' : 'bg-white'} border-4 rounded-3xl p-8 text-center relative">
              <button onclick="state.showHint=!state.showHint; render();" class="absolute top-4 right-4 bg-blue-100 hover:bg-blue-200 font-bold px-4 py-2 rounded-full text-blue-700">💡 Pomoc</button>
              <div class="text-gray-400 font-bold uppercase tracking-widest mb-4">Napiš přesně tento text:</div>
              <div class="text-4xl sm:text-5xl md:text-6xl font-black mb-10 tracking-wide break-all">${lettersHtml}</div>
              <div class="flex flex-col sm:flex-row gap-4 max-w-4xl mx-auto">
                <input id="wordInput" type="text" oninput="handleStroke(event)" value="${state.typedText}" class="flex-grow text-center text-3xl font-bold p-4 bg-gray-50 border-4 rounded-2xl outline-none ${state.isBossFight ? 'border-red-400 text-red-900' : 'border-gray-300'}" placeholder="${state.startTime ? 'Piš...' : 'Klikni a začni psát...'}" autofocus autocomplete="off" spellcheck="false" />
                <button onclick="skipWord();" ${state.isBossFight || !state.canSkip ? 'disabled' : ''} class="px-6 py-4 bg-orange-400 hover:bg-orange-500 text-white font-black text-xl rounded-2xl disabled:opacity-40">⏭️ Přeskočit</button>
              </div>
              ${hintHtml}
            </div>
          </div>
        `;
        
        setTimeout(() => {
          const input = document.getElementById('wordInput');
          if (input) {
            input.focus();
            input.setSelectionRange(state.typedText.length, state.typedText.length);
          }
        }, 0);
      }

      else if (state.gameState === 'game_over') {
        const currentCpm = state.elapsedSeconds > 0 ? Math.round((state.correctStrokes / state.elapsedSeconds) * 60) : 0;
        const totalStrokes = state.correctStrokes + state.wrongStrokes;
        const accuracy = totalStrokes > 0 ? Math.round((state.correctStrokes / totalStrokes) * 100) : 100;
        
        root.innerHTML = `
          <div class="max-w-2xl mx-auto bg-red-800 rounded-3xl shadow-2xl p-10 text-center text-white border-4 border-red-500">
            <div class="text-8xl mb-6">💀</div>
            <h1 class="text-5xl font-black mb-4">Konec hry!</h1>
            <p class="text-xl mb-8">Došly ti životy. Ale získané zkušenosti a zlaťáky ti zůstávají!</p>
            <div class="bg-red-950 rounded-xl p-8 mb-8 text-left grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Tvoje Postava</h3>
                <p>Úroveň: <strong class="text-amber-400">${state.charLevel}</strong></p>
                <p>Zlaťáky celkem: <strong class="text-amber-400">${state.gold}</strong></p>
              </div>
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Statistiky Lekce</h3>
                <p>Správné úseky: <strong class="text-green-400">${state.score}</strong></p>
                <p>Přesnost: <strong>${accuracy} %</strong></p>
                <p>Rychlost: <strong class="text-amber-400">${currentCpm} úhozů/min</strong></p>
              </div>
            </div>
            <button onclick="goState('mode_select');" class="w-full bg-white text-red-900 font-bold py-4 rounded-xl text-xl hover:bg-red-100">Zpět do menu</button>
          </div>
        `;
      }
    }

    loadSave();
    render();
  </script>
</body>
</html>
