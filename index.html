  <!-- Načtení Google Fonts pro stylové písmo -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
    }
    @keyframes shakeHero {
      0%, 100% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-10px) rotate(-8deg) scale(0.95); }
      75% { transform: translateX(10px) rotate(8deg) scale(0.95); }
    }
    @keyframes breatheHero {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-5px) scaleY(1.03); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes wind {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(20deg); }
    }
    @keyframes spin-slow {
      100% { transform: rotate(360deg); }
    }
    .animate-shake {
      animation: shakeHero 0.3s ease-in-out;
    }
    .animate-breathe {
      animation: breatheHero 3s ease-in-out infinite;
      transform-origin: 100px 150px;
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    .animate-wind {
      animation: wind 2s ease-in-out infinite;
    }
    .animate-spin-slow {
      animation: spin-slow 15s linear infinite;
    }
  </style>
</head>

    // --- POMOCNÉ FUNKCE PRO ZKUŠENOSTI (EXP) ---
    function getExpNeeded(level) {
      const req = { 
        1: 10,  // celkem k L2: 10
        2: 15,  // celkem k L3: 25
        3: 20,  // celkem k L4: 45
        4: 25,  // celkem k L5: 70
        5: 40,  // celkem k L6: 110
        6: 60,  // celkem k L7: 170
        7: 90,  // celkem k L8: 260
        8: 140, // celkem k L9: 400
        9: 200  // celkem k L10: 600
      };
      return req[level] || 9999;
    }

    function getCumulativeExp(targetLevel) {
      if (targetLevel === 1) return 0;
      let total = 0;
      for (let i = 1; i < targetLevel; i++) {
        total += getExpNeeded(i);
      }
      return total;
    }

    // --- STATE MANAGEMENT ---
    let state = {
      appMode: null, // 'basic' / 'game'
      gameState: 'mode_select', // mode_select, level_select, playing, game_over, handbook, shop
      currentLevel: null,
      currentWord: '',
      typedText: '',
      score: 0,
      skips: 0,
      correctStrokes: 0,
      wrongStrokes: 0,
      startTime: null,
      elapsedSeconds: 0,
      canSkip: true,
      showHint: false,
      
      // RPG
      hp: 100,
      charLevel: 1,
      exp: 0,
      gold: 0,
      potions: 0,
      ownedPets: [],
      activePet: null,
      
      // Boss
      wordsTypedCounter: 0,
      isBossFight: false,
      bossTimeLeft: 0,
      
      // Anims
      hitAnim: false,
      healAnim: false,
      levelUpAnim: false,
      
      soundEnabled: false,
      recentHistory: []
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // --- LOCAL STORAGE ---
    function loadSave() {
      try {
        const saved = localStorage.getItem('klavesnicovy_mistr_save_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.charLevel = parsed.charLevel || 1;
          state.exp = parsed.exp || 0;
          state.gold = parsed.gold || 0;
          state.potions = parsed.potions || 0;
          state.ownedPets = parsed.ownedPets || [];
          state.activePet = parsed.activePet || null;
        }
      } catch (e) {
        console.error("Uložení nelze načíst", e);
      }
    }

    function saveGame() {
      try {
        const data = {
          charLevel: state.charLevel,
          exp: state.exp,
          gold: state.gold,
          potions: state.potions,
          ownedPets: state.ownedPets,
          activePet: state.activePet
        };
        localStorage.setItem('klavesnicovy_mistr_save_v1', JSON.stringify(data));
      } catch (e) {
        console.error("Uložení selhalo", e);
      }
    }

    // --- AUDIO GENERATOR (Web Audio API) ---
    function playTone(type) {
      if (!state.soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'heal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(550, now); osc.frequency.exponentialRampToValueAtTime(1100, now + 0.3);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'levelup') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.15);
        osc.frequency.setValueAtTime(660, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'boss_warn') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'buy') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1400, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    // --- GAME LOGIC ---
    function pickWord(levelId) {
      const words = LEVELS[levelId].words;
      let avail = words.filter(w => !state.recentHistory.includes(w));
      if (avail.length === 0) avail = words;
      return avail[Math.floor(Math.random() * avail.length)];
    }

    function checkLevelUp() {
      const needed = getExpNeeded(state.charLevel);
      if (state.exp >= needed && state.charLevel < 10) {
        state.charLevel++;
        state.exp -= needed;
        state.levelUpAnim = true;
        playTone('levelup');
        setTimeout(() => {
          state.levelUpAnim = false;
          render();
        }, 3000);
      }
    }

    function handleStroke(e) {
      if (state.gameState !== 'playing') return;
      const inputVal = e.target.value;

      if (!state.startTime) {
        state.startTime = Date.now();
      }

      if (inputVal.length > state.typedText.length) {
        const expectedPrefix = state.currentWord.substring(0, inputVal.length);
        const isCorrect = inputVal === expectedPrefix;

        if (isCorrect) {
          state.correctStrokes++;
          playTone('hit');
        } else {
          state.wrongStrokes++;
          playTone('error');
          if (state.appMode === 'game') {
            state.hp -= 5;
            state.hitAnim = true;
            setTimeout(() => { state.hitAnim = false; render(); }, 300);
            if (state.hp <= 0) {
              state.gameState = 'game_over';
              saveGame();
              render();
              return;
            }
          }
        }
      }

      state.typedText = inputVal;

      if (inputVal === state.currentWord) {
        // Slovo/úsek dokončen
        setTimeout(() => {
          state.score++;
          state.canSkip = true;

          if (state.appMode === 'game') {
            if (state.isBossFight) {
              state.isBossFight = false;
              state.hp = Math.min(100, state.hp + 20);
              state.exp += 20;
              state.gold += 50;
              playTone('levelup');
            } else {
              let bGold = state.activePet === 'dog' ? 2 : 0;
              let bExp = state.activePet === 'dragon' ? 1 : 0;
              let bHeal = state.activePet === 'cat' ? 3 : 1;

              state.hp = Math.min(100, state.hp + bHeal);
              state.exp += LEVELS[state.currentLevel].id + bExp;
              state.gold += state.currentWord.length + bGold;
              state.healAnim = true;
              playTone('heal');
              setTimeout(() => { state.healAnim = false; render(); }, 400);
            }

            checkLevelUp();
            state.wordsTypedCounter++;
            if (state.wordsTypedCounter % 15 === 0 && !state.isBossFight) {
              // Spuštění Bosse
              state.isBossFight = true;
              playTone('boss_warn');
              state.bossTimeLeft = 15;
              state.typedText = '';
              state.currentWord = BOSS_TEXTS[Math.floor(Math.random() * BOSS_TEXTS.length)];
              saveGame();
              render();
              return;
            }
          }

          state.typedText = '';
          const nextW = pickWord(state.currentLevel);
          state.currentWord = nextW;
          state.recentHistory.push(nextW);
          if (state.recentHistory.length > 10) state.recentHistory.shift();
          saveGame();
          render();
        }, 200);
      }
      render();
    }

    // --- TIMERS ---
    setInterval(() => {
      if (state.gameState === 'playing' && state.startTime && !state.isBossFight) {
        state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
        render();
      }
    }, 1000);

    setInterval(() => {
      if (state.gameState === 'playing' && state.isBossFight && state.bossTimeLeft > 0) {
        state.bossTimeLeft--;
        if (state.bossTimeLeft === 0) {
          playTone('error');
          state.hp -= 30;
          state.hitAnim = true;
          setTimeout(() => { state.hitAnim = false; render(); }, 500);
          state.isBossFight = false;
          state.typedText = '';
          const nextW = pickWord(state.currentLevel);
          state.currentWord = nextW;
          if (state.hp <= 0) {
            state.gameState = 'game_over';
          }
        }
        render();
      }
    }, 1000);

    function renderPetSVG(petId) {
      if (petId === 'dog') {
        return `
          <g transform="translate(130, 150) scale(0.6)">
            <path d="M 0 30 Q -10 30 -10 10 Q 0 -10 20 -10 Q 40 -10 50 10 Q 60 30 50 30 Z" fill="#8B4513" />

            <circle cx="30" cy="5" r="3" fill="#000" />
            <ellipse cx="20" cy="15" rx="6" ry="4" fill="#000" />
          </g>
        `;
      }
      if (petId === 'cat') {
        return `
          <g transform="translate(135, 145) scale(0.5)">
            <path d="M 0 30 Q -10 30 -10 10 Q 0 -10 20 -10 Q 40 -10 50 10 Q 60 30 50 30 Z" fill="#2F4F4F" />
            <polygon points="-10,0 -20,-20 0,-10" fill="#2F4F4F" />
            <polygon points="50,0 60,-20 40,-10" fill="#2F4F4F" />
            <circle cx="10" cy="5" r="4" fill="#FFD700" />
            <circle cx="30" cy="5" r="4" fill="#FFD700" />
          </g>
        `;
      }
      if (petId === 'owl') {
        return `
          <g transform="translate(140, 60) scale(0.5)" class="animate-float">
            <ellipse cx="20" cy="20" rx="25" ry="30" fill="#A9A9A9" />
            <circle cx="5" cy="10" r="10" fill="#FFF" />
            <circle cx="35" cy="10" r="10" fill="#FFF" />
          </g>
        `;
      }
      if (petId === 'dragon') {
        return `
          <g transform="translate(130, 40) scale(0.6)" class="animate-float">
            <path d="M 10 30 Q -10 10 10 -10 Q 30 -30 50 -10 Q 70 10 50 30 Z" fill="#8B0000" />
            <circle cx="20" cy="0" r="3" fill="#FFD700" />
            <circle cx="40" cy="0" r="3" fill="#FFD700" />
          </g>
        `;
      }
      return "";
    }

    // --- RENDER SCREEN ENGINE ---
    function render() {
      const root = document.getElementById('app');
      root.innerHTML = '';
      
      const expNeededForNextLevel = getExpNeeded(state.charLevel);

      if (state.gameState === 'mode_select') {
        root.innerHTML = `
          <div class="max-w-4xl mx-auto text-center">

            <p class="text-2xl text-gray-600 mb-12">Vyber si, jak chceš dnes trénovat!</p>
            
            <div class="grid md:grid-cols-2 gap-8 mb-12">
              <button onclick="state.appMode='basic'; state.gameState='level_select'; render();" class="bg-white p-10 rounded-3xl shadow-xl hover:shadow-2xl border-4 border-blue-200 hover:border-blue-500 transition-all transform hover:-translate-y-2 text-left relative overflow-hidden group">
                <div class="text-7xl mb-6">🏫</div>

                <p class="text-gray-500 text-lg">Bez stresu a životů. Sleduj svou rychlost a přesnost v detailních statistikách!</p>
              </button>

              <button onclick="state.appMode='game'; state.gameState='level_select'; render();" class="bg-white p-10 rounded-3xl shadow-xl hover:shadow-2xl border-4 border-amber-200 hover:border-amber-500 transition-all transform hover:-translate-y-2 text-left relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 bg-amber-400 text-white font-black py-1 px-8 rounded-bl-3xl shadow-md rotate-12">HRA!</div>

              <div class="bg-amber-100 text-amber-900 inline-block px-8 py-3 rounded-full font-black text-2xl border-4 border-amber-300 shadow-sm">

                    ${catBought ? `<button onclick="equipPet('cat');" class="px-4 py-2 rounded-lg font-bold text-sm w-full ${state.activePet === 'cat' ? 'bg-green-500 text-white' : 'bg-gray-200'}">${state.activePet === 'cat' ? 'Aktivní' : 'Vybavit'}</button>` : `<button onclick="buyShopItem('pet', 300, 'cat');" class="px-4 py-2 rounded-lg font-bold text-sm w-full bg-amber-400 text-white">300 🪙</button>`}

                  <!-- Owl -->

                    ${owlBought ? `<button onclick="equipPet('owl');" class="px-4 py-2 rounded-lg font-bold text-sm w-full ${state.activePet === 'owl' ? 'bg-green-500 text-white' : 'bg-gray-200'}">${state.activePet === 'owl' ? 'Aktivní' : 'Vybavit'}</button>` : `<button onclick="buyShopItem('pet', 400, 'owl');" class="px-4 py-2 rounded-lg font-bold text-sm w-full bg-amber-400 text-white">400 🪙</button>`}

                </div>

            </div>

        `;
      }

      else if (state.gameState === 'playing') {
        const expectedPrefix = state.currentWord.substring(0, state.typedText.length);

        // Vykreslení písmen
        let lettersHtml = "";
        state.currentWord.split('').forEach((char, index) => {
          let col = "text-gray-700";
          let bg = "";
          if (index < state.typedText.length) {
            if (state.typedText[index] === char) {
              col = "text-green-500 font-bold";
            } else {
              col = "text-red-500 font-bold";
              bg = "bg-red-100 rounded-sm";
            }
          }
          if (char === ' ') {
            lettersHtml += `<span class="inline-block w-4 mx-1 ${bg}">&nbsp;</span>`;

                      </div>
                    </div>

                      🧪 <span class="font-bold text-sm">${state.potions}x</span>

                <div class="bg-blue-100 px-4 py-1 rounded-xl">🎯 ${accuracy} %</div>
                <div class="bg-indigo-100 px-4 py-1 rounded-xl">⚡ ${currentCpm} CPM</div>
                ${state.isBossFight ? `<div class="bg-white text-red-600 px-4 py-1 rounded-xl border-2 border-red-600 animate-pulse font-black">⏳ ${state.bossTimeLeft}s</div>` : ''}
              </div>
            </div>

            <!-- HRACÍ PLOCHA -->
            <div class="${state.isBossFight ? 'bg-red-50 border-red-400' : 'bg-white'} border-4 rounded-3xl p-8 text-center relative">
              <button onclick="state.showHint=!state.showHint; render();" class="absolute top-4 right-4 bg-blue-100 hover:bg-blue-200 font-bold px-4 py-2 rounded-full text-blue-700">💡 Pomoc</button>
              
              <div class="text-gray-400 font-bold uppercase tracking-widest mb-4">Napiš přesně tento text:</div>
              <div class="text-4xl sm:text-5xl md:text-6xl font-black mb-10 tracking-wide break-all">${lettersHtml}</div>

              <div class="flex flex-col sm:flex-row gap-4 max-w-4xl mx-auto">
                <input id="wordInput" type="text" oninput="handleStroke(event)" value="${state.typedText}" class="flex-grow text-center text-3xl font-bold p-4 bg-gray-50 border-4 rounded-2xl outline-none ${state.isBossFight ? 'border-red-400 text-red-900' : 'border-gray-300'}" placeholder="${state.startTime ? 'Piš...' : 'Klikni a začni psát...'}" autofocus autocomplete="off" spellcheck="false" />
                <button onclick="skipWord();" ${state.isBossFight || !state.canSkip ? 'disabled' : ''} class="px-6 py-4 bg-orange-400 hover:bg-orange-500 text-white font-black text-xl rounded-2xl disabled:opacity-40">⏭️ Přeskočit</button>
              </div>

              ${hintHtml}
            </div>
          </div>
        `;
        document.getElementById('wordInput').focus();
      }

      else if (state.gameState === 'game_over') {
        root.innerHTML = `
          <div class="max-w-2xl mx-auto bg-red-800 rounded-3xl shadow-2xl p-10 text-center text-white border-4 border-red-500">
            <div class="text-8xl mb-6">💀</div>
            <h1 class="text-5xl font-black mb-4">Konec hry!</h1>
            <p class="text-xl mb-8">Došly ti životy. Ale získané zkušenosti a zlaťáky ti zůstávají!</p>
            
            <div class="bg-red-950 rounded-xl p-8 mb-8 text-left grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Tvoje Postava</h3>
                <p>Úroveň: <strong class="text-amber-400">${state.charLevel}</strong></p>
                <p>Zlaťáky celkem: <strong class="text-amber-400">${state.gold}</strong></p>
              </div>
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Statistiky Lekce</h3>
                <p>Správné úseky: <strong class="text-green-400">${state.score}</strong></p>
                <p>Přesnost: <strong>${accuracy} %</strong></p>
                <p>Rychlost: <strong class="text-amber-400">${currentCpm} úhozů/min</strong></p>
              </div>
            </div>

            <button onclick="state.gameState='mode_select'; render();" class="w-full bg-white text-red-900 font-bold py-4 rounded-xl text-xl hover:bg-red-100">Zpět do menu</button>
          </div>
        `;
      }
    }

    // --- BUTTON EVENT BRIDGE FUNCTIONS ---
    window.toggleSound = () => { toggleSound(); render(); };
    window.startGame = (levelId) => { startGame(levelId); render(); };
    window.drinkPotion = () => { usePotion(); render(); };
    window.skipWord = () => { handleSkip(); render(); };
    window.buyShopItem = (itemType, price, id) => { buyItem(itemType, price, id); render(); };
    window.equipPet = (id) => { state.activePet = id; playTone('buy'); saveGame(); render(); };

    // Inicializace
    loadSave();
    render();
  </script>
</body>
</html>
