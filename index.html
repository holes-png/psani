<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klávesnicový Mistr ⌨️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght=400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; }
    @keyframes shakeHero {
      0%, 100% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-10px) rotate(-8deg) scale(0.95); }
      75% { transform: translateX(10px) rotate(8deg) scale(0.95); }
    }
    @keyframes breatheHero {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.02) translateY(-2px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes wind {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(20deg); }
    }
    @keyframes spin-slow {
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-key {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.3); }
    }
    .animate-shake { animation: shakeHero 0.3s ease-in-out; }
    .animate-breathe { animation: breatheHero 4s ease-in-out infinite; transform-origin: center bottom; will-change: transform; }
    .animate-float { animation: float 4s ease-in-out infinite; will-change: transform; }
    .animate-wind { animation: wind 2s ease-in-out infinite; will-change: transform; }
    .animate-spin-slow { animation: spin-slow 15s linear infinite; will-change: transform; }
    .pulse-target-key { animation: pulse-key 1s ease-in-out infinite; z-index: 10; }
    
    /* VLASTNÍ TŘÍDA PRO OSTRÝ PIXELART */
    .pixel-art {
      image-rendering: pixelated; 
      object-fit: contain; 
      padding: 5%; /* Zmenšený vnitřní okraj pro optimální velikost v kruhu */
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.25)); /* Přidán prémiový stín */
    }
  </style>
</head>

    // --- GLOBÁLNÍ FUNKCE (PŘESNĚ DLE TVÉHO NÁVRHU) ---
    function getExpNeeded(level) {
      const req = { 
        1: 10, 2: 20, 3: 30, 4: 40, 5: 50,
        6: 70, 7: 110, 8: 150, 9: 200, 10: 300, 11: 500, 12: 9999 
      };
      return req[level] || 9999;
    }

    function getCumulativeExp(targetLevel) {
      return getExpNeeded(targetLevel - 1);

    function loadSave() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.charLevel = parsed.charLevel || 1;
          state.exp = parsed.exp || 0;
          state.gold = parsed.gold || 0;
          state.potions = parsed.potions || 0;
          state.ownedPets = parsed.ownedPets || [];
          state.activePet = parsed.activePet || null;
          state.hp = parsed.hp !== undefined ? parsed.hp : 100; 
        }
      } catch (e) { console.error("Nelze nacist ukladani:", e); }
    }

    function saveGame() {
      try {
        const data = {
          charLevel: state.charLevel, exp: state.exp, gold: state.gold,
          potions: state.potions, ownedPets: state.ownedPets, activePet: state.activePet,
          hp: state.hp 
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (e) { console.error("Nelze ulozit:", e); }
    }

    function playTone(type) {
      if (!state.soundEnabled) return;
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'heal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(550, now); osc.frequency.exponentialRampToValueAtTime(1100, now + 0.3);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'levelup') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.15);
        osc.frequency.setValueAtTime(660, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'boss_warn') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'buy') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1400, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    function pickWord(levelId) {
      const words = LEVELS[levelId].words;
      let avail = words.filter(w => {
         const str = typeof w === 'string' ? w : w.label;
         return !state.recentHistory.includes(str);
      });
      if (avail.length === 0) avail = words;
      return avail[Math.floor(Math.random() * avail.length)];
    }

    function checkLevelUp() {
      const needed = getExpNeeded(state.charLevel);
      if (state.exp >= needed && state.charLevel < 12) {
        state.charLevel++;
        state.exp -= needed; 
        state.levelUpAnim = true;
        playTone('levelup');
        setTimeout(() => { state.levelUpAnim = false; render(); }, 3000);
      }
    }

    function processCorrectWord() {
        setTimeout(() => {
          state.score++;
          state.canSkip = true;

          if (state.appMode === 'game') {
            const lvl = LEVELS[state.currentLevel];
            const isKeyMode = lvl.type === 'keys';

            if (state.isBossFight) {
              state.isBossFight = false;
              state.hp = Math.min(100, state.hp + 20);
              state.exp += 20;
              state.gold += 50;
              state.lastEarnedGold = 50;
              playTone('levelup');
            } else {
              let gainedGold = 0;
              let bGold = (state.activePet === 'dog' && !isKeyMode) ? 1 : 0; 
              let bExp = state.activePet === 'dragon' ? 1 : 0;
              let bHeal = state.activePet === 'cat' ? 3 : 1;

              state.hp = Math.min(100, state.hp + bHeal);
              
              let baseReward = lvl.expReward;
              if (state.showHint && baseReward > 0) {
                baseReward = Math.max(0, Math.floor(baseReward / 2));
              }
              state.exp += baseReward + (baseReward > 0 ? bExp : 0);

              if (!isKeyMode) {
                let wordLen = typeof state.currentWord === 'string' ? state.currentWord.length : 5;
                gainedGold = wordLen + bGold;
                state.gold += gainedGold;
              }
              
              state.lastEarnedGold = gainedGold;
              state.healAnim = true;
              playTone('heal');
              setTimeout(() => { state.healAnim = false; render(); }, 400);
            }

            checkLevelUp();
            
            if (lvl.type !== 'keys') {
              state.wordsTypedCounter++;
              if (state.wordsTypedCounter % 15 === 0 && !state.isBossFight) {
                state.isBossFight = true;
                playTone('boss_warn');
                state.bossTimeLeft = 15;
                state.typedText = '';
                
                const bossTextsList = BOSS_TEXTS_BY_LEVEL_CZ[state.currentLevel] || BOSS_TEXTS_BY_LEVEL_CZ[1];
                const selectedBossPhrase = bossTextsList[Math.floor(Math.random() * bossTextsList.length)];
                
                state.currentWordObj = selectedBossPhrase;
                state.currentWord = selectedBossPhrase;
                saveGame();
                render();
                return;
              }
            }
          }

          state.typedText = '';
          const nextW = pickWord(state.currentLevel);
          state.currentWordObj = nextW;
          state.currentWord = nextW.label || nextW;
          state.recentHistory.push(state.currentWord);
          if (state.recentHistory.length > 10) state.recentHistory.shift();
          saveGame();
          render();
          
          setTimeout(() => {
            state.lastEarnedGold = 0;
            render();
          }, 1500);

        }, 200);
    }

    function penalizePlayer() {
        if (state.appMode === 'game') {
          let damage = state.activePet === 'owl' ? 2 : 5; 
          state.hp -= damage;
          state.hitAnim = true;
          setTimeout(() => { state.hitAnim = false; render(); }, 300);
          if (state.hp <= 0) {
            handleDeath();
          }
        }
    }

    function handleDeath() {
      deathSnapshot.charLevel = state.charLevel;
      deathSnapshot.gold = state.gold;

      state.gameState = 'game_over';
      
      state.charLevel = 1;
      state.exp = 0;
      state.gold = 0;
      state.potions = 0;
      state.hp = 100;
      state.ownedPets = [];
      state.activePet = null;
      
      saveGame();
      render();
    }

    function handleStroke(e) {
      if (state.gameState !== 'playing') return;
      const lvl = LEVELS[state.currentLevel];
      if (lvl.type === 'keys') return;

      const inputVal = e.target.value;
      if (!state.startTime) state.startTime = Date.now();

      if (inputVal.length > state.typedText.length) {
        const expectedPrefix = state.currentWord.substring(0, inputVal.length);
        if (inputVal === expectedPrefix) {
          state.correctStrokes++;
          playTone('hit');
        } else {
          state.wrongStrokes++;
          playTone('error');
          penalizePlayer();
          if (state.gameState === 'game_over') return;
        }
      }

      state.typedText = inputVal;

      if (inputVal === state.currentWord) {
        processCorrectWord();
      }
      render();
    }

    function handleKeyMode(e) {
      if (state.gameState !== 'playing') return;
      const lvl = LEVELS[state.currentLevel];
      if (lvl.type !== 'keys') return;

      e.preventDefault();

      if (!state.startTime) state.startTime = Date.now();
      if (e.type !== 'keydown') return;

      const target = state.currentWordObj;
      let combo = [];
      
      if (e.ctrlKey) combo.push('control');
      if (e.shiftKey && e.key !== 'Shift') combo.push('shift');
      if (e.altKey && e.key !== 'Alt') combo.push('alt');

      let pressedKey = e.key.toLowerCase();
      if (pressedKey === ' ') pressedKey = 'space';
      
      if (!['control', 'shift', 'alt', 'meta', 'os'].includes(pressedKey)) {
        combo.push(pressedKey);
      } else if (combo.length === 0) {
        combo.push(pressedKey);
      }

      let pressedStr = combo.join('+');
      
      let isMatch = false;
      for (let match of target.match) {
        let m = match.toLowerCase();
        if (m === pressedStr || m === pressedKey || m === e.code.toLowerCase()) {
            isMatch = true;
        }
      }

      if (['control', 'shift', 'alt'].includes(pressedKey) && !isMatch) {
          return;
      }

      if (isMatch) {
        state.correctStrokes++;
        playTone('hit');
        state.typedText = '✅ Správně!';
        render();
        processCorrectWord();
      } else {
        state.wrongStrokes++;
        playTone('error');
        state.typedText = '❌ Špatná klávesa';
        render();
        penalizePlayer();
      }
    };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      render();

      }

      const nextW = pickWord(state.currentLevel);
      state.currentWordObj = nextW;
      state.currentWord = nextW.label || nextW;
      state.recentHistory.push(state.currentWord);
      if (state.recentHistory.length > 10) state.recentHistory.shift();
      render();
    }

      if (state.gold >= price) {

        if (itemType === 'potion') state.potions++;
        else if (itemType === 'pet') { state.ownedPets.push(id); state.activePet = id; }

                    <div class="flex-grow">
                      <div class="flex justify-between font-black mb-1"><span class="text-blue-700">⭐ Zkušenosti</span><span>${state.charLevel >= 12 ? `${state.exp} / 500` : `${state.exp} / ${expNeededForNextLevel}`}</span></div>
                      <div class="h-6 bg-blue-100 rounded-full border-2 border-blue-200 overflow-hidden shadow-inner"><div class="bg-blue-500 h-full transition-all" style="width: ${state.charLevel >= 12 ? Math.min(100, (state.exp / 500) * 100) : (state.exp / expNeededForNextLevel) * 100}%"></div></div>
                    </div>
                    <button onclick="window.drinkPotion();" ${state.potions <= 0 || state.hp >= 100 ? 'disabled' : ''} class="p-3 bg-red-100 hover:bg-red-200 border-2 border-red-300 rounded-xl transition-all disabled:opacity-40">🧪 <span class="font-bold text-sm">${state.potions}x</span></button>
                  </div>
                </div>
              </div>
            ` : ''}

            <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-3xl border-2 border-indigo-100 gap-4 mb-6">
              <div class="flex gap-4">
                <button onclick="window.goState('level_select');" class="bg-gray-100 font-bold px-4 py-2 hover:bg-gray-200 rounded-xl">← Odejít</button>
                <button onclick="window.toggleSoundBtn();" class="bg-gray-100 font-bold px-4 py-2 hover:bg-gray-200 rounded-xl">${state.soundEnabled ? '🔊' : '🔇'}</button>
                ${state.appMode === 'game' ? `<button onclick="state.showQuickShop = true; render();" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl flex items-center gap-1 shadow-sm transition-transform active:scale-95">🛒 Obchod</button>` : ''}
              </div>
              <div class="flex flex-wrap gap-4 justify-center text-lg font-bold">
                ${state.appMode === 'game' ? `
                  <div class="bg-amber-100 px-4 py-1 rounded-xl relative flex items-center">
                    💰 <span class="ml-1">${state.gold}</span>
                    ${state.lastEarnedGold > 0 ? `<span class="absolute -top-6 right-0 text-amber-500 font-black text-sm animate-bounce">+${state.lastEarnedGold} 💰</span>` : ''}
                  </div>
                ` : ''}
                <div class="bg-green-100 px-4 py-1 rounded-xl">✓ ${state.score}</div>
                <div class="bg-red-100 px-4 py-1 rounded-xl">❌ ${state.wrongStrokes}</div>
                <div class="bg-blue-100 px-4 py-1 rounded-xl">🎯 ${accuracy} %</div>
                <div class="bg-indigo-100 px-4 py-1 rounded-xl">⚡ ${currentCpm} CPM</div>
                ${state.isBossFight ? `<div class="bg-white text-red-600 px-4 py-1 rounded-xl border-2 border-red-600 animate-pulse font-black">⏳ ${state.bossTimeLeft}s</div>` : ''}
              </div>
            </div>

            <div class="${state.isBossFight ? 'bg-red-50 border-red-400' : 'bg-white'} border-4 rounded-3xl p-4 sm:p-8 text-center relative">
              <div class="absolute top-4 left-4 bg-indigo-100 text-indigo-800 font-black px-4 py-2 rounded-xl text-xs sm:text-sm shadow-sm select-none">
                ${state.isBossFight ? '🔥 SOUBOJ S BOSSEM' : `${lvl.name}`}
              </div>
              <button onclick="state.showHint=!state.showHint; render();" class="absolute top-4 right-4 bg-blue-100 hover:bg-blue-200 font-bold px-4 py-2 rounded-full text-blue-700 z-20">💡 Pomoc</button>
              
              <div class="text-gray-400 font-bold uppercase tracking-widest mb-4 pt-14 sm:pt-6">${isKeyMode ? 'Zkouška ovládání:' : 'Napiš přesně tento text:'}</div>
              <div class="text-4xl sm:text-5xl md:text-6xl font-black mb-10 tracking-wide break-all">${lettersHtml}</div>
              
              <div class="flex flex-col sm:flex-row gap-4 max-w-4xl mx-auto">
                <input id="wordInput" type="text" 
                  ${isKeyMode ? 'readonly' : ''}
                  onkeydown="${isKeyMode ? 'window.handleKeyMode(event)' : ''}" 
                  oninput="${!isKeyMode ? 'window.handleStroke(event)' : ''}" 
                  value="${state.typedText}" 
                  class="flex-grow text-center text-3xl font-bold p-4 bg-gray-50 border-4 rounded-2xl outline-none ${state.isBossFight ? 'border-red-400 text-red-900' : 'border-gray-300'}" 
                  placeholder="${isKeyMode ? 'Stiskni požadovanou klávesu...' : (state.startTime ? 'Piš...' : 'Klikni a začni psát...')}" 
                  autofocus autocomplete="off" spellcheck="false" 
                />
                <button onclick="window.skipWord();" ${state.isBossFight || !state.canSkip ? 'disabled' : ''} class="px-6 py-4 bg-orange-400 hover:bg-orange-500 text-white font-black text-xl rounded-2xl disabled:opacity-40 shadow-md">⏭️ Přeskočit</button>
              </div>
              ${hintHtml}
            </div>
          </div>
        `;
        
        setTimeout(() => {
          const input = document.getElementById('wordInput');
          if (input) {
            input.focus();
            if (!isKeyMode) {
                input.setSelectionRange(state.typedText.length, state.typedText.length);
            }
          }
        }, 0);
      }

      else if (state.gameState === 'game_over') {
        const currentCpm = state.elapsedSeconds > 0 ? Math.round((state.correctStrokes / state.elapsedSeconds) * 60) : 0;
        const totalStrokes = state.correctStrokes + state.wrongStrokes;
        const accuracy = totalStrokes > 0 ? Math.round((state.correctStrokes / totalStrokes) * 100) : 100;
        
        root.innerHTML = `
          <div class="max-w-2xl mx-auto bg-red-800 rounded-3xl shadow-2xl p-10 text-center text-white border-4 border-red-500">
            <div class="text-8xl mb-6">💀</div>
            <h1 class="text-5xl font-black mb-4">Konec hry!</h1>
            <p class="text-xl mb-8">Došly ti životy. Tvůj hrdina padl v boji a jeho postup byl kompletně vymazán. Zkus to znovu od nuly!</p>
            <div class="bg-red-950 rounded-xl p-8 mb-8 text-left grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Tvá Postava (Před smrtí)</h3>
                <p>Dosažená úroveň: <strong class="text-amber-400">${deathSnapshot.charLevel}</strong></p>
                <p>Zlaťáky celkem: <strong class="text-amber-400">${deathSnapshot.gold}</strong></p>
              </div>
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Statistiky Lekce</h3>
                <p>Správné úseky: <strong class="text-green-400">${state.score}</strong></p>
                <p>Přesnost: <strong>${accuracy} %</strong></p>
                <p>Rychlost: <strong class="text-amber-400">${currentCpm} úhozů/min</strong></p>
              </div>
            </div>
            <button onclick="window.goState('mode_select');" class="w-full bg-white text-red-900 font-bold py-4 rounded-xl text-xl hover:bg-red-100">Zpět do menu</button>
          </div>
        `;
      }
    }

    // --- PŘIŘAZENÍ DO GLOBÁLNÍHO SCOPE PRO ONCLICK V HTML ---
    window.setMode = setMode;
    window.goState = goState;
    window.startLevel = startLevel;
    window.drinkPotion = drinkPotion;
    window.skipWord = skipWord;
    window.buyShopItem = buyShopItem;
    window.equipPet = equipPet;
    window.handleStroke = handleStroke;
    window.handleKeyMode = handleKeyMode;
    window.toggleSoundBtn = toggleSoundBtn;
    window.adminAddExp = adminAddExp;
    window.adminAddGold = adminAddGold;
    window.adminLevelUp = adminLevelUp;
    window.adminResetLevel = adminResetLevel;
    window.openAdminPrompt = openAdminPrompt;
    window.submitAdminPass = submitAdminPass;
    window.executeReset = executeReset;

    loadSave();
    render();
  </script>
</body>
</html>
