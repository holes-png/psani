<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klávesnicový Mistr ⌨️</title>
  <!-- Načtení Tailwind CSS pro moderní vzhled -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Načtení Google Fonts pro stylové písmo -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; }
    @keyframes shakeHero {
      0%, 100% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-10px) rotate(-8deg) scale(0.95); }
      75% { transform: translateX(10px) rotate(8deg) scale(0.95); }
    }
    @keyframes breatheHero {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-5px) scaleY(1.03); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes wind {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(20deg); }
    }
    @keyframes spin-slow {
      100% { transform: rotate(360deg); }
    }
    .animate-shake { animation: shakeHero 0.3s ease-in-out; }
    .animate-breathe { animation: breatheHero 3s ease-in-out infinite; transform-origin: 100px 150px; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-wind { animation: wind 2s ease-in-out infinite; }
    .animate-spin-slow { animation: spin-slow 15s linear infinite; }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col justify-between relative">

  <!-- ZOBRAZENÍ VERZE -->
  <div id="version-display" class="absolute bottom-2 right-4 text-xs font-bold text-gray-400 select-none pointer-events-none z-50"></div>

  <!-- HLAVNÍ KONTEJNER -->
  <div id="app" class="w-full max-w-6xl mx-auto p-2 sm:p-4 my-auto">
    <!-- Dynamicky se měnící obsah přes JavaScript -->
  </div>

  <script>

    // --- KLÍČ K ULOŽENÍ ---

      5: {

        words: ['a+B-', 'x?Z!', '1@9&', '+A-b', '=1?2', '!.@,', '&*()', 'A@b*', 'X+y-', '1*2(', 'c&D*', 'E!f?', 'g@H+', '3-4=', 'i,J.', 'k?L!', 'm+N-', '5&6*', 'o(P)', 'q=R+', 's?T!', 'u@V&', 'w+X-', 'y*Z(', '7@8&', '9-0=', 'a.B,', 'c!D?', 'e(F)', 'g*H&']
      },
      6: {
        id: 6, name: 'Úroveň 6: Ninja klávesnice 🥷',
        type: 'text',
        expReward: 6,
        description: 'Skupiny 6 složitých znaků (často s AltGr).',
        words: ['#a${}b', '[c]d<e', '>f~g\\', '|h^i€', '§j°k#', '$l{m}', '[n<o>', '~p\\q|', '^r€s§', '°t#u$', '{v}w[', ']x<y>', '~z\\A|', '^B€C§', '°D#E$', '{F}G[', ']H<I>', '~J\\K|', '^L€M§', '°N#O$', '#1$2{3', '}4[5]', '<6>7~8', '\\9|0^', '€a§b°', '#X$Y{Z', '}A[B]', '<C>D~E', '\\F|G^', '§1°2#']
      }
    };

    // --- PROGRESIVNÍ DATABÁZE BOSSŮ PODLE ÚROVNÍ ---
    const BOSS_TEXTS_BY_LEVEL = {
      1: ["maly pes", "les sumi", "mrak leti", "auto jede", "bily slon", "les krici"],
      2: ["cerna zaba", "ostry nuz", "tepla vece", "zlate slunce", "divoky ptak"],
      3: ["Mame velky hlad!", "Slunce zapada rychle!", "Auto jede rychle!", "Venku silne prsi!"],
      4: ["Pozor, drak chrlí oheň!", "Rychle, utíkej pryč!", "Uf, to bylo těsné!", "Slyšíš ten hluk?"],
      5: ["a+B-x!", "1@9&?", "+A-b=", "=1?2!"],
      6: ["#a\${}b", "[c]d<e", ">f~g\\", "|h^i€"]
    };

    const HERO_NAMES = {
      1: 'Rolník', 2: 'Dřevorubec', 3: 'Strážný', 4: 'Šermíř', 5: 'Ninja',
      6: 'Mág', 7: 'Paladin', 8: 'Drakobijec', 9: 'Kyborg', 10: 'Pán Klávesnice'
    };

    // --- GLOBÁLNÍ FUNKCE ---
    function getExpNeeded(level) {
      const req = { 1: 10, 2: 15, 3: 20, 4: 25, 5: 40, 6: 60, 7: 90, 8: 140, 9: 200 };
      return req[level] || 9999;
    }

    function getCumulativeExp(targetLevel) {
      if (targetLevel === 1) return 0;
      let total = 0;
      for (let i = 1; i < targetLevel; i++) {
        total += getExpNeeded(i);
      }
      return total;
    }

    function getHintForChar(char) {
      if (!char) return null;
      const charMap = {
        'ť': [['Shift', 'ˇ (vedle Backspace)', 'poté', 't']], 'ď': [['Shift', 'ˇ (vedle Backspace)', 'poté', 'd']], 'ň': [['Shift', 'ˇ (vedle Backspace)', 'poté', 'n']],
        'Ť': [['Shift', 'ˇ', 'poté', 'Shift', 'T']], 'Ď': [['Shift', 'ˇ', 'poté', 'Shift', 'D']], 'Ň': [['Shift', 'ˇ', 'poté', 'Shift', 'N']],
        '@': [['Pravý Alt (AltGr)', 'V']], '#': [['Pravý Alt (AltGr)', 'X']], '&': [['Pravý Alt (AltGr)', 'C']],
        '{': [['Pravý Alt (AltGr)', 'B']], '}': [['Pravý Alt (AltGr)', 'N']], '[': [['Pravý Alt (AltGr)', 'F']],
        ']': [['Pravý Alt (AltGr)', 'G']], '<': [['Pravý Alt (AltGr)', ',']], '>': [['Pravý Alt (AltGr)', '.']],
        '~': [['Pravý Alt (AltGr)', '1']], '\\': [['Pravý Alt (AltGr)', 'Q']], '|': [['Pravý Alt (AltGr)', 'W']],
        '^': [['Pravý Alt (AltGr)', '3']], '€': [['Pravý Alt (AltGr)', 'E']], '§': [['Klávesa pod Esc']],
        '°': [['Pravý Alt (AltGr)', '5']], '$': [['Pravý Alt (AltGr)', 'Ů']], '?': [['Shift', ', (čárka)']],
        '!': [['Shift', '§ (pod Esc)']], '+': [['Numerická +'], ['1 (vlevo nahoře)']], '-': [['Numerická -'], ['- (vedle pravého Shiftu)']],
        '=': [['Shift', '- (vedle pravého Shiftu)']], '*': [['Numerická *'], ['Pravý Alt (AltGr)', '-']], '/': [['Numerická /'], ['Shift', 'ú']],
        '.': [['Numerická .'], ['Klávesa . (vedle čárky)']], ',': [['Klávesa , (vedle M)']], ' ': [['Mezerník (nejdelší klávesa dole)']],
        'á': [['Číslo 8 (v horní řadě)']], 'é': [['Číslo 0 (v horní řadě)']], 'í': [['Číslo 9 (v horní řadě)']],
        'ý': [['Číslo 7 (v horní řadě)']], 'ú': [['Klávesa vedle P']], 'ů': [['Klávesa vedle L']],
        'š': [['Číslo 3 (v horní řadě)']], 'č': [['Číslo 4 (v horní řadě)']], 'ř': [['Číslo 5 (v horní řadě)']],
        'ž': [['Číslo 6 (v horní řadě)']], 'ě': [['Číslo 2 (v horní řadě)']], '(': [['Shift', '8 (v horní řadě)']], ')': [['Shift', '9 (v horní řadě)']],
      };
      if (charMap[char]) return charMap[char];
      if (/[0-9]/.test(char)) return [[`Numerická ${char}`], ['Shift', `${char} (v horní řadě)`]];
      if (/[A-Z]/.test(char)) return [['Shift', char.toUpperCase()]];
      if (/[ÁÉÍÓÚŮÝŠČŘŽ]/.test(char)) {
        const lower = char.toLowerCase();
        if (charMap[lower]) return [['Shift', charMap[lower][0][0]]];
      }
      return [[`Klávesa ${char.toUpperCase()}`]];
    }

    // --- STATE MANAGEMENT ---
    let state = {
      appMode: null, 
      gameState: 'mode_select', 
      currentLevel: null,
      currentWordObj: null, // Pro speciální klávesy
      currentWord: '', // Textová verze pro výpis
      typedText: '',
      score: 0,
      skips: 0,
      correctStrokes: 0,
      wrongStrokes: 0,
      startTime: null,
      elapsedSeconds: 0,
      canSkip: true,
      showHint: false,
      hp: 100,
      charLevel: 1,
      exp: 0,
      gold: 0,
      potions: 0,
      ownedPets: [],
      activePet: null,
      wordsTypedCounter: 0,
      isBossFight: false,
      bossTimeLeft: 0,
      hitAnim: false,
      healAnim: false,
      levelUpAnim: false,
      soundEnabled: false,
      recentHistory: [],
      showResetConfirm: false // Pro okno na reset
    };

    let audioCtx = null;

    function loadSave() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.charLevel = parsed.charLevel || 1;
          state.exp = parsed.exp || 0;
          state.gold = parsed.gold || 0;
          state.potions = parsed.potions || 0;
          state.ownedPets = parsed.ownedPets || [];
          state.activePet = parsed.activePet || null;
        }
      } catch (e) { console.error("Nelze nacist ukladani:", e); }
    }

    function saveGame() {
      try {
        const data = {
          charLevel: state.charLevel, exp: state.exp, gold: state.gold,
          potions: state.potions, ownedPets: state.ownedPets, activePet: state.activePet
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (e) { console.error("Nelze ulozit:", e); }
    }

    function playTone(type) {
      if (!state.soundEnabled) return;
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'heal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(550, now); osc.frequency.exponentialRampToValueAtTime(1100, now + 0.3);
        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'levelup') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.15);
        osc.frequency.setValueAtTime(660, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'boss_warn') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'buy') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1400, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    function pickWord(levelId) {
      const words = LEVELS[levelId].words;
      let avail = words.filter(w => {
         const str = typeof w === 'string' ? w : w.label;
         return !state.recentHistory.includes(str);
      });
      if (avail.length === 0) avail = words;
      return avail[Math.floor(Math.random() * avail.length)];
    }

    function checkLevelUp() {
      const needed = getExpNeeded(state.charLevel);
      if (state.exp >= needed && state.charLevel < 10) {
        state.charLevel++;
        state.exp -= needed;
        state.levelUpAnim = true;
        playTone('levelup');
        setTimeout(() => { state.levelUpAnim = false; render(); }, 3000);
      }
    }

    // --- LOGIKA ÚSPĚCHU / NEÚSPĚCHU (SDÍLENÁ PRO OBA MÓDY) ---
    function processCorrectWord() {
        setTimeout(() => {
          state.score++;
          state.canSkip = true;

          if (state.appMode === 'game') {
            if (state.isBossFight) {
              state.isBossFight = false;
              state.hp = Math.min(100, state.hp + 20);
              state.exp += 20;
              state.gold += 50;
              playTone('levelup');
            } else {
              let bGold = state.activePet === 'dog' ? 2 : 0;
              let bExp = state.activePet === 'dragon' ? 1 : 0;
              let bHeal = state.activePet === 'cat' ? 3 : 1;

              state.hp = Math.min(100, state.hp + bHeal);
              
              // KONTROLA NÁPOVĚDY PRO EXP ODMĚNU
              let baseReward = LEVELS[state.currentLevel].expReward;
              if (state.showHint && baseReward > 0) {
                baseReward = Math.max(0, Math.floor(baseReward / 2));
              }
              state.exp += baseReward + (baseReward > 0 ? bExp : 0);

              let wordLen = typeof state.currentWord === 'string' ? state.currentWord.length : 5;
              state.gold += wordLen + bGold;
              state.healAnim = true;
              playTone('heal');
              setTimeout(() => { state.healAnim = false; render(); }, 400);
            }

            checkLevelUp();
            
            // Boss se aktivuje pouze u textových úrovní (Úroveň 1 až 6)
            const lvl = LEVELS[state.currentLevel];
            if (lvl.type !== 'keys') {
              state.wordsTypedCounter++;
              if (state.wordsTypedCounter % 15 === 0 && !state.isBossFight) {
                state.isBossFight = true;
                playTone('boss_warn');
                state.bossTimeLeft = 15;
                state.typedText = '';
                
                const bossTextsList = BOSS_TEXTS_BY_LEVEL[state.currentLevel] || BOSS_TEXTS_BY_LEVEL[1];
                const selectedBossPhrase = bossTextsList[Math.floor(Math.random() * bossTextsList.length)];
                
                state.currentWordObj = selectedBossPhrase;
                state.currentWord = selectedBossPhrase;
                saveGame();
                render();
                return;
              }
            }
          }

          state.typedText = '';
          const nextW = pickWord(state.currentLevel);
          state.currentWordObj = nextW;
          state.currentWord = nextW.label || nextW;
          state.recentHistory.push(state.currentWord);
          if (state.recentHistory.length > 10) state.recentHistory.shift();
          saveGame();
          render();
        }, 200);
    }

    function penalizePlayer() {
        if (state.appMode === 'game') {
          state.hp -= 5;
          state.hitAnim = true;
          setTimeout(() => { state.hitAnim = false; render(); }, 300);
          if (state.hp <= 0) {
            state.gameState = 'game_over';
            saveGame();
            render();
          }
        }
    }

    // --- OBSLUHA TEXTOVÉHO MÓDU ---
    function handleStroke(e) {
      if (state.gameState !== 'playing') return;
      const lvl = LEVELS[state.currentLevel];
      if (lvl.type === 'keys') return;

      const inputVal = e.target.value;
      if (!state.startTime) state.startTime = Date.now();

      if (inputVal.length > state.typedText.length) {
        const expectedPrefix = state.currentWord.substring(0, inputVal.length);
        if (inputVal === expectedPrefix) {
          state.correctStrokes++;
          playTone('hit');
        } else {
          state.wrongStrokes++;
          playTone('error');
          penalizePlayer();
          if (state.gameState === 'game_over') return;
        }
      }

      state.typedText = inputVal;

      if (inputVal === state.currentWord) {
        processCorrectWord();
      }
      render();
    }

    // --- OBSLUHA KLÁVESOVÉHO MÓDU A ZKRATEK ---
    window.handleKeyMode = function(e) {
      if (state.gameState !== 'playing') return;
      const lvl = LEVELS[state.currentLevel];
      if (lvl.type !== 'keys') return;

      e.preventDefault();

      if (!state.startTime) state.startTime = Date.now();
      if (e.type !== 'keydown') return;

      const target = state.currentWordObj;
      let combo = [];
      
      if (e.ctrlKey) combo.push('control');
      if (e.shiftKey && e.key !== 'Shift') combo.push('shift');
      if (e.altKey && e.key !== 'Alt') combo.push('alt');

      let pressedKey = e.key.toLowerCase();
      if (pressedKey === ' ') pressedKey = 'space';
      
      if (!['control', 'shift', 'alt', 'meta', 'os'].includes(pressedKey)) {
        combo.push(pressedKey);
      } else if (combo.length === 0) {
        combo.push(pressedKey);
      }

      let pressedStr = combo.join('+');
      
      let isMatch = false;
      for (let match of target.match) {
        let m = match.toLowerCase();
        if (m === pressedStr || m === pressedKey || m === e.code.toLowerCase()) {
            isMatch = true;
        }
      }

      if (['control', 'shift', 'alt'].includes(pressedKey) && !isMatch) {
          return;
      }

      if (isMatch) {
        state.correctStrokes++;
        playTone('hit');
        state.typedText = '✅ Správně!';
        render();
        processCorrectWord();
      } else {
        state.wrongStrokes++;
        playTone('error');
        state.typedText = '❌ Špatná klávesa';
        render();
        penalizePlayer();
      }
    };


    // --- BUTTON A EVENT FUNKCE ---
    function toggleSoundBtn() { 
      state.soundEnabled = !state.soundEnabled; 
      if (state.soundEnabled && !audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      render(); 
    }

    window.executeReset = function() {
      localStorage.removeItem(SAVE_KEY);
      state.charLevel = 1;
      state.exp = 0;
      state.gold = 0;
      state.potions = 0;
      state.ownedPets = [];
      state.activePet = null;
      state.showResetConfirm = false;
      render();
    };

    function setMode(mode) {
      state.appMode = mode;
      state.gameState = 'level_select';
      render();
    }

    function goState(target) {
      state.gameState = target;
      if (target === 'level_select') state.startTime = null;
      render();
    }

    function startLevel(levelId) { 
      state.currentLevel = levelId;
      state.score = 0; state.skips = 0; state.correctStrokes = 0; state.wrongStrokes = 0;
      state.startTime = null; state.elapsedSeconds = 0; state.canSkip = true; state.typedText = '';
      state.showHint = false; state.isBossFight = false; state.wordsTypedCounter = 0;
      if (state.appMode === 'game') state.hp = 100;
      state.recentHistory = [];
      const firstWord = pickWord(levelId);
      state.currentWordObj = firstWord;
      state.currentWord = firstWord.label || firstWord;
      state.recentHistory.push(state.currentWord);
      state.gameState = 'playing';
      render();
    }

    function drinkPotion() { 
      if (state.potions > 0 && state.hp < 100) {
        state.potions--; state.hp = Math.min(100, state.hp + 50);
        playTone('heal'); state.healAnim = true;
        setTimeout(() => { state.healAnim = false; render(); }, 400);
        render();
      }
    }

    function skipWord() { 
      if (!state.canSkip || state.isBossFight) return;
      state.skips++; state.canSkip = false; state.typedText = '';
      const nextW = pickWord(state.currentLevel);
      state.currentWordObj = nextW;
      state.currentWord = nextW.label || nextW;
      state.recentHistory.push(state.currentWord);
      if (state.recentHistory.length > 10) state.recentHistory.shift();
      render();
    }

    function buyShopItem(itemType, price, id) { 
      if (state.gold >= price) {
        state.gold -= price; playTone('buy');
        if (itemType === 'potion') state.potions++;
        else if (itemType === 'pet') { state.ownedPets.push(id); state.activePet = id; }
        saveGame();
      } else playTone('error');
      render();
    }

    function equipPet(id) { 
      state.activePet = id; playTone('buy'); saveGame(); render(); 
    }

    // --- TIMERS ---
    setInterval(() => {
      if (state.gameState === 'playing' && state.startTime && !state.isBossFight) {
        state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
        render();
      }
    }, 1000);

    setInterval(() => {
      if (state.gameState === 'playing' && state.isBossFight && state.bossTimeLeft > 0) {
        state.bossTimeLeft--;
        if (state.bossTimeLeft === 0) {
          playTone('error');
          state.hp -= 30;
          state.hitAnim = true;
          setTimeout(() => { state.hitAnim = false; render(); }, 500);
          state.isBossFight = false;
          state.typedText = '';
          const nextW = pickWord(state.currentLevel);
          state.currentWordObj = nextW;
          state.currentWord = nextW.label || nextW;
          if (state.hp <= 0) state.gameState = 'game_over';
        }
        render();
      }
    }, 1000);

              </div>
              <div>
                <h3 class="font-bold text-red-300 mb-2 uppercase border-b border-red-800 pb-2">Statistiky Lekce</h3>
                <p>Správné úseky: <strong class="text-green-400">${state.score}</strong></p>
                <p>Přesnost: <strong>${accuracy} %</strong></p>
                <p>Rychlost: <strong class="text-amber-400">${currentCpm} úhozů/min</strong></p>
              </div>
            </div>
            <button onclick="goState('mode_select');" class="w-full bg-white text-red-900 font-bold py-4 rounded-xl text-xl hover:bg-red-100">Zpět do menu</button>
          </div>
        `;
      }
    }

    loadSave();
    render();
  </script>
</body>
</html>
